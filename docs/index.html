<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Our Work — Happy Family Cleaning Solutions</title>
<meta name="robots" content="noindex">
<style>
  :root{
    --cyan:#29ABE2; --cyan-dark:#1B87B4; --ink:#141618; --body:#4a5158;
    --line:#e3e7ea; --bg:#ffffff; --card:#ffffff; --soft:#f5f7f9;
    --radius:14px; --shadow:0 1px 2px rgba(20,22,24,.05), 0 8px 24px rgba(20,22,24,.07);
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{
    background:var(--bg); color:var(--body);
    font:16px/1.55 "Helvetica Neue", Helvetica, Arial, system-ui, sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .wrap{max-width:1180px;margin:0 auto;padding:8px 20px 40px}

  /* ---- filter bar ---- */
  .bar{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:14px 0 20px}
  .chip{
    appearance:none;border:1.5px solid var(--line);background:#fff;color:var(--body);
    font:600 13.5px/1 inherit;letter-spacing:.01em;padding:9px 15px;border-radius:999px;
    cursor:pointer;transition:.15s ease;white-space:nowrap;
  }
  .chip:hover{border-color:var(--cyan);color:var(--cyan-dark)}
  .chip[aria-pressed="true"]{background:var(--cyan);border-color:var(--cyan);color:#fff}
  .chip:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
  .count{margin-left:auto;font-size:13px;color:#8b949b;white-space:nowrap}

  /* ---- grid ---- */
  .grid{display:grid;gap:24px;grid-template-columns:repeat(auto-fill,minmax(330px,1fr))}
  .card{
    background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow);transition:.18s ease;
    display:flex;flex-direction:column;
  }
  .card:hover{transform:translateY(-2px);box-shadow:0 2px 4px rgba(20,22,24,.06),0 14px 32px rgba(20,22,24,.10)}

  /* ---- hero: two labelled halves, never claimed to be the same room ---- */
  .hero{display:grid;grid-template-columns:1fr 1fr;gap:2px;background:var(--line);
        cursor:zoom-in;position:relative}
  .hero.one{grid-template-columns:1fr}
  .half{position:relative;aspect-ratio:1/1;background:var(--soft);overflow:hidden}
  .hero.one .half{aspect-ratio:4/3}
  .half img{width:100%;height:100%;object-fit:cover;display:block}
  .lab{
    position:absolute;top:9px;left:9px;font:700 10px/1 inherit;letter-spacing:.11em;
    text-transform:uppercase;color:#fff;background:rgba(20,22,24,.66);
    padding:5px 8px;border-radius:4px;pointer-events:none;
  }
  .half.a .lab{background:rgba(41,171,226,.94)}
  .more{
    position:absolute;right:8px;bottom:8px;font:600 11px/1 inherit;color:#fff;
    background:rgba(20,22,24,.66);padding:6px 9px;border-radius:5px;pointer-events:none;
  }

  .meta{padding:14px 16px 16px;margin-top:auto}
  .svc{
    display:inline-block;font:700 11px/1 inherit;letter-spacing:.09em;text-transform:uppercase;
    color:var(--cyan-dark);background:rgba(41,171,226,.10);padding:6px 9px;border-radius:5px;
  }
  .title{margin:9px 0 0;font:600 16px/1.35 inherit;color:var(--ink)}
  .sub{margin:4px 0 0;font-size:13px;color:#949ca3}

  /* ---- states ---- */
  .state{padding:56px 20px;text-align:center;color:#8b949b}
  .state h2{margin:0 0 6px;font:600 18px/1.3 inherit;color:var(--ink)}
  .skeleton{background:var(--soft);border-radius:var(--radius);aspect-ratio:4/3;
      animation:pulse 1.4s ease-in-out infinite}
  @keyframes pulse{0%,100%{opacity:1}50%{opacity:.55}}

  /* ---- lightbox ---- */
  dialog#lb{border:0;padding:0;background:transparent;max-width:min(1180px,95vw);width:100%}
  dialog#lb::backdrop{background:rgba(12,14,16,.9)}
  #lb .shell{background:#0e1012;border-radius:12px;overflow:hidden}
  #lb .stage{position:relative;height:min(66vh,62vw);min-height:250px;background:#0e1012;
             overflow:hidden}
  #lb .stage img{width:100%;height:100%;object-fit:contain;display:block}
  #lb .stage .lab{top:12px;left:12px;font-size:11px;padding:6px 10px}
  #lb .cap{display:flex;gap:12px;align-items:center;padding:11px 14px;color:#cfd6db;font-size:14px;
           flex-wrap:wrap}
  #lb .cap b{color:#fff;font-weight:600}
  #lb .of{color:#8a949c;font-size:13px}
  #lb .nav{margin-left:auto;display:flex;gap:8px}
  #lb button{appearance:none;border:0;background:#22282d;color:#fff;
      font:600 13px/1 inherit;padding:9px 14px;border-radius:6px;cursor:pointer}
  #lb button:hover{background:var(--cyan)}
  #lb button[disabled]{opacity:.35;cursor:default}
  #lb button[disabled]:hover{background:#22282d}

  /* thumbnail rail, grouped */
  #lb .rail{display:flex;gap:6px;overflow-x:auto;padding:10px 14px 14px;background:#0e1012;
            border-top:1px solid #1d2226;align-items:center}
  #lb .rail .gl{font:700 9.5px/1 inherit;letter-spacing:.12em;text-transform:uppercase;
                color:#7d878f;padding:0 8px 0 2px;white-space:nowrap;flex:0 0 auto}
  #lb .rail .gl.a{color:var(--cyan)}
  #lb .rail img{width:58px;height:58px;object-fit:cover;border-radius:5px;cursor:pointer;
                flex:0 0 auto;opacity:.5;transition:.15s;border:2px solid transparent}
  #lb .rail img:hover{opacity:.85}
  #lb .rail img[aria-current="true"]{opacity:1;border-color:var(--cyan)}

  @media (max-width:640px){
    .wrap{padding:4px 14px 32px}
    .grid{gap:18px;grid-template-columns:1fr}
    .bar{padding:10px 0 16px}
    .count{width:100%;margin:4px 0 0}
    #lb .stage{height:min(58vh,80vw)}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="bar" id="bar" hidden></div>
  <div class="grid" id="grid">
    <div class="skeleton"></div><div class="skeleton"></div><div class="skeleton"></div>
  </div>
  <div class="state" id="state" hidden></div>
</div>

<dialog id="lb">
  <div class="shell">
    <div class="stage" id="lbStage"></div>
    <div class="cap">
      <b id="lbTitle"></b><span id="lbDate"></span><span class="of" id="lbOf"></span>
      <span class="nav">
        <button type="button" id="lbPrev" aria-label="Previous photo">‹ Prev</button>
        <button type="button" id="lbNext" aria-label="Next photo">Next ›</button>
        <button type="button" id="lbClose">Close</button>
      </span>
    </div>
    <div class="rail" id="lbRail"></div>
  </div>
</dialog>

<script>
(function () {
  "use strict";

  var FEED = "gallery.json";
  var grid = document.getElementById("grid");
  var bar = document.getElementById("bar");
  var state = document.getElementById("state");
  var lb = document.getElementById("lb");
  var data = { items: [], services: [] };
  var filter = "All";

  /* ---------- height reporting, so the site embed has no inner scrollbar ---------- */
  var lastH = 0;
  function reportHeight() {
    var h = Math.ceil(document.documentElement.scrollHeight);
    if (Math.abs(h - lastH) > 8) {
      lastH = h;
      try { parent.postMessage({ hfcsPortfolioHeight: h }, "*"); } catch (e) {}
    }
  }
  window.addEventListener("resize", reportHeight);
  setInterval(reportHeight, 700);

  function prettyDate(iso) {
    var p = String(iso).split("-");
    if (p.length !== 3) return "";
    var months = ["January","February","March","April","May","June","July",
                  "August","September","October","November","December"];
    var m = months[parseInt(p[1], 10) - 1];
    return m ? m + " " + parseInt(p[2], 10) + ", " + p[0] : "";
  }

  function before(i) { return i.before || []; }
  function after(i)  { return i.after  || []; }

  /* ---------- lightbox ---------- */
  var lbItem = null, lbShots = [], lbAt = 0;

  function shotsFor(item) {
    var out = [];
    before(item).forEach(function (m, n) {
      out.push({ m: m, group: "Before", n: n + 1, of: before(item).length });
    });
    after(item).forEach(function (m, n) {
      out.push({ m: m, group: "After", n: n + 1, of: after(item).length });
    });
    return out;
  }

  function paint() {
    var s = lbShots[lbAt];
    if (!s) return;
    var stage = document.getElementById("lbStage");
    stage.innerHTML = "";
    var img = new Image();
    img.src = s.m.src;
    img.alt = s.group + " photo " + s.n + " of " + s.of;
    stage.appendChild(img);
    var lab = document.createElement("span");
    lab.className = "lab";
    lab.textContent = s.group;
    if (s.group === "After") lab.style.background = "rgba(41,171,226,.94)";
    stage.appendChild(lab);

    document.getElementById("lbOf").textContent = s.group + " " + s.n + " of " + s.of;
    document.getElementById("lbPrev").disabled = lbAt === 0;
    document.getElementById("lbNext").disabled = lbAt === lbShots.length - 1;

    var rail = document.getElementById("lbRail");
    Array.prototype.forEach.call(rail.querySelectorAll("img"), function (t, n) {
      t.setAttribute("aria-current", String(n === lbAt));
    });
    var cur = rail.querySelector('img[aria-current="true"]');
    if (cur && cur.scrollIntoView) cur.scrollIntoView({ block: "nearest", inline: "nearest" });
  }

  function buildRail() {
    var rail = document.getElementById("lbRail");
    rail.innerHTML = "";
    var lastGroup = null;
    lbShots.forEach(function (s, n) {
      if (s.group !== lastGroup) {
        var gl = document.createElement("span");
        gl.className = "gl" + (s.group === "After" ? " a" : "");
        gl.textContent = s.group;
        rail.appendChild(gl);
        lastGroup = s.group;
      }
      var t = new Image();
      t.src = s.m.thumb; t.alt = s.group + " " + s.n;
      t.loading = "lazy"; t.decoding = "async";
      t.addEventListener("click", function () { lbAt = n; paint(); });
      rail.appendChild(t);
    });
  }

  function openLightbox(item, index) {
    lbItem = item;
    lbShots = shotsFor(item);
    if (!lbShots.length) return;
    lbAt = Math.max(0, Math.min(index || 0, lbShots.length - 1));
    document.getElementById("lbTitle").textContent = item.title || item.service;
    document.getElementById("lbDate").textContent = item.date ? prettyDate(item.date) : "";
    buildRail();
    paint();
    if (typeof lb.showModal === "function") lb.showModal();
  }

  function step(n) {
    lbAt = Math.max(0, Math.min(lbAt + n, lbShots.length - 1));
    paint();
  }
  document.getElementById("lbPrev").addEventListener("click", function () { step(-1); });
  document.getElementById("lbNext").addEventListener("click", function () { step(1); });
  document.getElementById("lbClose").addEventListener("click", function () { lb.close(); });
  lb.addEventListener("click", function (e) { if (e.target === lb) lb.close(); });
  lb.addEventListener("keydown", function (e) {
    if (e.key === "ArrowLeft") { e.preventDefault(); step(-1); }
    if (e.key === "ArrowRight") { e.preventDefault(); step(1); }
  });

  /* ---------- cards ---------- */
  function half(media, label, cls) {
    var d = document.createElement("div");
    d.className = "half " + cls;
    var img = new Image();
    img.src = media.thumb; img.alt = label + " photo";
    img.loading = "lazy"; img.decoding = "async";
    var l = document.createElement("span");
    l.className = "lab"; l.textContent = label;
    d.append(img, l);
    return d;
  }

  function card(item) {
    var b = before(item), a = after(item);
    var el = document.createElement("article");
    el.className = "card";

    var hero = document.createElement("div");
    hero.className = "hero" + (b.length && a.length ? "" : " one");
    if (b.length) hero.appendChild(half(b[0], "Before", "b"));
    if (a.length) hero.appendChild(half(a[0], "After", "a"));

    var total = b.length + a.length;
    if (total > 2) {
      var more = document.createElement("span");
      more.className = "more";
      more.textContent = "View all " + total + " photos";
      hero.appendChild(more);
    }
    hero.addEventListener("click", function () { openLightbox(item, 0); });
    el.appendChild(hero);

    var meta = document.createElement("div");
    meta.className = "meta";
    var svc = document.createElement("span");
    svc.className = "svc"; svc.textContent = item.service;
    var t = document.createElement("h3");
    t.className = "title";
    t.textContent = item.title && item.title !== item.service ? item.title : "Completed job";
    meta.append(svc, t);

    var sub = document.createElement("p");
    sub.className = "sub";
    var bits = [];
    if (b.length) bits.push(b.length + " before");
    if (a.length) bits.push(a.length + " after");
    sub.textContent = bits.join(" · ") + (item.date ? "  ·  " + prettyDate(item.date) : "");
    meta.appendChild(sub);

    el.appendChild(meta);
    return el;
  }

  /* ---------- render ---------- */
  function render() {
    var items = data.items.filter(function (i) {
      return filter === "All" || i.service === filter;
    });
    grid.innerHTML = "";
    if (!items.length) {
      state.hidden = false;
      state.innerHTML = "<h2>Nothing here yet</h2><p>New before-and-after photos are added as jobs are completed.</p>";
      reportHeight();
      return;
    }
    state.hidden = true;
    var frag = document.createDocumentFragment();
    items.forEach(function (i) { frag.appendChild(card(i)); });
    grid.appendChild(frag);
    var c = document.querySelector(".count");
    if (c) c.textContent = items.length + (items.length === 1 ? " job shown" : " jobs shown");
    reportHeight();
  }

  function buildBar() {
    if (data.services.length < 2) { bar.hidden = true; return; }
    bar.hidden = false;
    bar.innerHTML = "";
    ["All"].concat(data.services).forEach(function (name) {
      var b = document.createElement("button");
      b.className = "chip"; b.type = "button"; b.textContent = name;
      b.setAttribute("aria-pressed", String(name === filter));
      b.addEventListener("click", function () {
        filter = name;
        bar.querySelectorAll(".chip").forEach(function (x) {
          x.setAttribute("aria-pressed", String(x.textContent === filter));
        });
        render();
      });
      bar.appendChild(b);
    });
    var c = document.createElement("span"); c.className = "count";
    bar.appendChild(c);
  }

  fetch(FEED + "?v=" + Date.now(), { cache: "no-store" })
    .then(function (r) { if (!r.ok) throw new Error("feed " + r.status); return r.json(); })
    .then(function (j) { data = j; buildBar(); render(); })
    .catch(function () {
      grid.innerHTML = "";
      state.hidden = false;
      state.innerHTML = "<h2>Gallery is loading</h2><p>If this stays here, the photo feed could not be reached. Please refresh.</p>";
      reportHeight();
    });
})();
</script>
</body>
</html>
