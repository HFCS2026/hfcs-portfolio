<!--
  HFCS LIVE PORTFOLIO — paste this into the Tailor Brands editor.

  Portfolio page  →  Add Widget  →  HTML / Embed Code  →  paste all of this.
  Make the widget full width. Do not set a fixed height; it sizes itself.

  ONE THING TO CHANGE: replace YOURUSERNAME below with your GitHub username.
  It appears once, in the src="" line.
-->

<div id="hfcs-portfolio" style="width:100%">
  <iframe
    id="hfcs-portfolio-frame"
    src="https://YOURUSERNAME.github.io/hfcs-portfolio/"
    title="Happy Family Cleaning Solutions — recent work"
    loading="lazy"
    scrolling="no"
    style="width:100%;height:1400px;border:0;display:block;overflow:hidden"></iframe>
</div>

<script>
(function () {
  var frame = document.getElementById("hfcs-portfolio-frame");
  window.addEventListener("message", function (e) {
    if (!e.data || typeof e.data.hfcsPortfolioHeight !== "number") return;
    if (frame.contentWindow !== e.source) return;
    frame.style.height = (e.data.hfcsPortfolioHeight + 24) + "px";
  });
})();
</script>
