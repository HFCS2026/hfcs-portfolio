name: Sync portfolio photos

on:
  schedule:
    # Every 3 hours. Times are UTC; this lands roughly every 3 hours Eastern too.
    - cron: "17 */3 * * *"
  workflow_dispatch:        # adds a "Run workflow" button you can press any time
  push:
    branches: [main]
    paths:
      - "seed/**"
      - "sync_portfolio.py"

permissions:
  contents: write

concurrency:
  group: portfolio-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull approved job photos from Jotform
        env:
          JOTFORM_API_KEY: ${{ secrets.JOTFORM_API_KEY }}
          PRE_FORM_ID: ${{ vars.PRE_FORM_ID || '261183496401052' }}
          POST_FORM_ID: ${{ vars.POST_FORM_ID || '261183572696063' }}
          PUBLISH_GATE: ${{ vars.PUBLISH_GATE || 'flag' }}
          REQUIRE_CONSENT: ${{ vars.REQUIRE_CONSENT || 'true' }}
        run: python sync_portfolio.py

      - name: Publish if anything changed
        run: |
          git config user.name  "HFCS Portfolio Bot"
          git config user.email "info@happyfamilycleaningsolutions.com"
          git add -A docs
          if git diff --staged --quiet; then
            echo "No new approved photos. Nothing to publish."
          else
            git commit -m "Portfolio: sync approved job photos ($(date -u '+%Y-%m-%d %H:%M UTC'))"
            git push
            echo "Published."
          fi
